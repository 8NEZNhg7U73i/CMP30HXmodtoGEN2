name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: Run Core Tests
        run: |
          cd windows-v3.0/tools/40hxcore
          go test -v ./...
      - name: Run Riot Tests
        run: |
          cd windows-v3.0/tools/unlockriot
          go test -v ./...
